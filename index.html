os animados", "13 - Muro Manabi ISE impedancias NEHRP", "14 - Galpon ISE tiempo-historia", "15 - Zapata rigida sobre Winkler", "16 - Tutorial crear un ejemplo nuevo", "validacion_L_sin_hueco", "validacion_losa_L_hueco", "validacion_losa_T", "validacion_losa_ductos", "validacion_pentagono", "validacion_rect_con_hueco", "validacion_trapecio_hueco_girado"]};
const $=id=>document.getElementById(id);let editado=false,actual=null;
function aviso(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').style.display='flex'}
function gut(){const n=$('ed').value.split('\n').length;let s='';for(let i=1;i<=n;i++)s+=i+'\n';$('gut').textContent=s;$('gut').scrollTop=$('ed').scrollTop}

$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('ed').value=r.result;gut();actual=null;limpiaMarca();$('ttl').textContent='Script OpenSees (.tcl) — '+f.name;

function guardar(){const b=new Blob([$('ed').value],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(actual||'modelo')+'.tcl';a.click()}

function inserta(tag){const s=D.snippets[tag];if(s==null)return;const e=$('ed'),a=e.selectionStart,b=e.selectionEnd;e.value=e.value.slice(0,a)+s+e.value.slice(b);e.selectionStart=e.selectionEnd=a+s.length;e.focus();gut();if(actual)marca();$('st').textContent='Insertado: '+s.trim().split('\n')[0]}

 Undo_Click:()=>document.execCommand('undo'),Redo_Click:()=>document.execCommand('redo'),Cut_Click:()=>document.execCommand('cut'),Copy_Click:()=>document.execCommand('copy'),Paste_Click:()=>aviso('Pegar','Usa Ctrl+V en el editor.'),SelectAll_Click:()=>{$('ed').select()},
 Comment_Click:comentar,Run_Click:correr,HelpRef_Click:()=>window.open('https://opensees.berkeley.edu/wiki/index.php/Command_Manual','_blank'),About_Click:()=>aviso('Hekatan OpenSees','Editor de scripts OpenSees (Tcl) con reporte. Esta es la <b>vista previa web</b>; la app de escritorio calcula en vivo con el AutoRun.')}[n]||(()=>{}))()}
